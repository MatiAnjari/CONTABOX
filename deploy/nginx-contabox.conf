# /etc/nginx/sites-available/contabox  (reemplaza contabox.tudominio.cl)
server {
    listen 80;
    server_name contabox.tudominio.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name contabox.tudominio.cl;

    # Certificado emitido con: sudo certbot --nginx -d contabox.tudominio.cl
    ssl_certificate     /etc/letsencrypt/live/contabox.tudominio.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contabox.tudominio.cl/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 6M;   # comprobantes y logos (la app limita a 5 MB)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /opt/contabox/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
